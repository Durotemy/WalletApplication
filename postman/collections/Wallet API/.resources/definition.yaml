$kind: collection
name: Wallet API
description: |-
  REST API for the Wallet learning project — a wallet/ledger API built with ASP.NET Core (.NET 10) and PostgreSQL.

  **Base URL:** {{baseUrl}}

  Make sure the **Wallet - Local** environment is selected before sending requests.

  **Getting started:**
  1. **Users → Register User** — creates the user and their wallet in one save; the test script stores `userId` and `walletId` in the environment.
  2. **Users → Get Wallet Balance** — reads the balance for `{{userId}}`.
  3. **Wallets → Fund Wallet** — adds `amount` to the wallet of `{{userId}}`.
