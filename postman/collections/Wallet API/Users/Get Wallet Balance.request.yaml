$kind: http-request
name: Get Wallet Balance
method: GET
url: '{{baseUrl}}/api/v1/users/:id/wallet'
order: 2000
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: '{{userId}}'
    description: The user id set automatically by Register User
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response contains a numeric balance", function () {
        const response = pm.response.json();
        const balance = typeof response === "number" ? response : response.balance;
        pm.expect(balance).to.be.a("number");
        pm.environment.set("lastBalance", balance);
      });
