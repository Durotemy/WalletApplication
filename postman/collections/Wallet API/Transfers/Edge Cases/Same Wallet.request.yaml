$kind: http-request
name: Same Wallet
method: POST
url: '{{baseUrl}}/api/v1/transfers'
order: 7000
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "fromWalletId": "{{walletId}}",
      "toWalletId": "{{walletId}}",
      "amount": 10,
      "description": "Transfer",
      "note": "To myself"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      console.log("Same Wallet ->", pm.response.code, pm.response.text());
